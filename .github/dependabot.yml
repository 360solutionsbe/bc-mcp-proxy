version: 2
updates:
  # Python deps from pyproject.toml + dxt/requirements.txt.
  # `directories` (plural, v2) lets one entry watch both. Groups bundle
  # related packages into a single weekly PR — one merge instead of N.
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/dxt"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    ignore:
      # The mcp 2.x line drops the two client APIs this proxy is built on:
      # mcp.client.streamable_http.streamablehttp_client and
      # mcp.shared.exceptions.McpError. Both pyproject.toml and
      # dxt/requirements.in therefore cap at <2.0.0. A major bump here is not a
      # version-pin question but a port of proxy.py to the 2.x client surface,
      # so it should be opened deliberately rather than arriving weekly and
      # failing at import time. Minor and patch updates within 1.x still come
      # through the mcp-stack group below.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
      # rpds-py 2026.x raises requires-python to >=3.11, but this project
      # supports 3.10 and the .dxt bundle vendors a cp310 wheel set. Dependabot
      # proposed 0.30.0 -> 2026.6.3 in #55 and the bundle-resolution job failed
      # on two platforms, which is the guard working — but the PR would return
      # with every 2026.x release. Revisit if requires-python is ever raised.
      - dependency-name: "rpds-py"
        update-types: ["version-update:semver-major"]
    groups:
      mcp-stack:
        patterns:
          - "mcp"
          - "httpx*"
          - "anyio"
      msal-stack:
        patterns:
          - "msal*"
      security-pins:
        # Transitive packages we explicitly == in dxt/requirements.txt
        # to force Snyk's GitHub-integrated static resolver to land on
        # patched versions. New CVEs in any of these should ship as one
        # weekly PR rather than eight separate ones.
        patterns:
          - "h11"
          - "cryptography"
          - "pyjwt"
          - "python-dotenv"
          - "python-multipart"
          - "requests"
          - "starlette"
          - "urllib3"
      test-stack:
        patterns:
          - "pytest*"

  # Pin GitHub Actions versions across workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"
